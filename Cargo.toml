[package]
name = "deepl-popup"
version = "0.1.3"
edition = "2024"
build = "build.rs"
description = "Ctrl+F9 selection translator popup powered by DeepL"
license = "MIT"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "system-proxy",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-window-handle = "0.6.2"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "unstable-winit-030",
    "system-tray",
    "compat-1-2",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
lto = true
strip = true
